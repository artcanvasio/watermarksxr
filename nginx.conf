server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html html; text/css css; text/javascript js mjs; application/json json;
    application/manifest+json webmanifest; application/octet-stream mind;
    image/png png; image/jpeg jpg jpeg; image/svg+xml svg; image/webp webp; image/x-icon ico;
    font/woff2 woff2; font/woff woff;
  }

  gzip on;
  gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml application/octet-stream;
  gzip_min_length 1024;

  # hashed vendor/targets rarely change: cache long. App shell: revalidate.
  location ~* ^/(vendor|targets|assets)/ { add_header Cache-Control "public, max-age=604800"; }
  location ~* \.(html|js|css|webmanifest)$ { add_header Cache-Control "no-cache"; }
  location /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }

  location / { try_files $uri $uri/ /index.html; }
}
